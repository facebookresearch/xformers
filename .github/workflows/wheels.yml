name: wheels

on:
  pull_request:
    paths:
      - ".github/compute_wheel_version.py"
      - ".github/workflows/wheel*"
      - ".github/actions/setup-build-cuda/action.yml"
      - "setup.py"
      - "requirements*.txt"
  push:
    branches:
      - main
    tags:
      - "v[0-9]+*"

jobs:
  # xFormers is pure Python, so one wheel serves every Python version, platform
  # and PyTorch build. It is built once here and uploaded to each of the places
  # it has always been published, so that nobody has to change how they install.
  build:
    # Nothing is compiled, so this needs no CUDA toolkit, no PyTorch and no
    # submodules -- unlike wheels_build.yml, which still serves the builds
    # that do compile.
    #
    # Open source only: in the fairinternal repo the tree still has kernels to
    # compile, so setup.py would want PyTorch and CUDA here. Those builds are
    # covered by build_fairinternal below.
    runs-on: ubuntu-latest
    if: github.repository == 'facebookresearch/xformers'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # for tags
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m pip install setuptools wheel
      - name: Define version
        env:
          VERSION_SOURCE: ${{ github.ref_type == 'tag' && 'tag' || 'dev' }}
        run: |
          set -Eeuo pipefail
          version=`python .github/compute_wheel_version.py --source $VERSION_SOURCE`
          echo $version > version.txt
          echo "BUILD_VERSION=$version" >> ${GITHUB_ENV}
      - run: echo "xformers-${BUILD_VERSION}"
      - name: Build wheel
        run: python setup.py bdist_wheel -d dist/
      - run: ls -l dist/
      - uses: actions/upload-artifact@v4
        with:
          name: wheel_facebookresearch
          path: dist/*.whl

  upload_pip:
    needs: build
    uses: ./.github/workflows/wheels_upload_pip.yml
    with:
      twine_username: __token__
      # There is only one wheel to choose from.
      filter: "*"
      execute: ${{ github.repository == 'facebookresearch/xformers' && github.event_name != 'pull_request' }}
    secrets:
      twine_password: ${{ secrets.PYPI_TOKEN }}

  upload_pt:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        # The same wheel goes to every index, so that `--index-url .../cu126`
        # and friends keep working. Since there is only one wheel, adding an
        # index costs an upload rather than a build, so this can cover every
        # index PyTorch currently ships.
        suffix:
          - cu126
          - cu128
          - cu129
          - cu130
          - cu132
          - rocm7.1
          - rocm7.2
    uses: ./.github/workflows/wheels_upload_s3.yml
    with:
      aws_role: "arn:aws:iam::749337293305:role/pytorch_bot_uploader_role"
      s3_path: s3://pytorch/whl/${{ matrix.suffix }}/
      aws_s3_cp_extra_args: --acl public-read
      filter: "*"
      execute: ${{ github.repository == 'facebookresearch/xformers' && github.ref_type == 'tag' }}
